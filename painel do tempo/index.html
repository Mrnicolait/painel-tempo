<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Previsão do Tempo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="painel">
        <div class="cabecalho">
            <span class="icone" aria-hidden="true">☀</span>
            <h1>PREVISÃO DO TEMPO</h1>
            <p>Hoje - Porto Alegre - RS</p>
        </div>
        <div class="card temperatura">
        <span class="icone" aria-hidden="true">☀</span>
        <span>Temperatura</span>
        <strong>26°C</strong>
    </div>
    <div class="card umidade">
        <span class="icone" aria-hidden="true">💧</span>
        <span>Umidade</span>
        <strong>65%</strong>
    </div>
    <div class="card vento">
        <span class="icone" aria-hidden="true">≋</span>
        <span>Vento</span>
        <strong>12 km/h</strong>
    </div>
    <div class="card condicao">
        <span class="icone" aria-hidden="true">☁</span>
        <span>Condição</span>
        <strong>Ensolarado</strong>
    </div>
    <div class="card amanha">
        <span class="icone" aria-hidden="true">▦</span>
        <span>Amanhã</span>
        <strong>25°C</strong>
    </div>
    <div class="card localizacao">
        <span class="icone" aria-hidden="true">⌖</span>
        <span>Localização</span>
        <strong>Porto Alegre</strong>
    </div>
    </div>
    
</body>
</html>
